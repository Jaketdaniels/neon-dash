<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Dash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a001a; font-family: 'Segoe UI', system-ui, sans-serif; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: radial-gradient(ellipse at center, rgba(20,0,40,0.7) 0%, rgba(5,0,15,0.95) 100%);
      transition: opacity 0.5s ease;
    }
    #ui-overlay.hidden { opacity: 0; pointer-events: none; }
    .title {
      font-size: clamp(2.5rem, 12vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff00aa, #00ffff, #ff00aa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neon-flow 3s linear infinite, pulse-glow 2s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(255,0,170,0.5), 0 0 40px rgba(0,255,255,0.3);
      margin-bottom: 0.5rem;
      text-align: center;
    }
    @keyframes neon-flow {
      to { background-position: 200% center; }
    }
    @keyframes pulse-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }
    .subtitle {
      color: #00ffff;
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0.85;
      text-shadow: 0 0 10px #00ffff;
    }
    #start-btn {
      pointer-events: auto;
      padding: 1rem 2.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0a001a;
      background: linear-gradient(135deg, #ff00aa, #ff66cc);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255,0,170,0.6), 0 0 50px rgba(255,0,170,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn:hover, #start-btn:active {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255,0,170,0.8), 0 0 70px rgba(255,0,170,0.4);
    }
    .hint {
      margin-top: 2rem;
      color: #aa88ff;
      font-size: 0.85rem;
      opacity: 0.7;
      text-align: center;
      max-width: 90%;
    }
    #score-ui, #hud {
      position: absolute; top: 1rem; left: 0; right: 0;
      display: none; justify-content: space-between; padding: 0 1rem;
      color: #00ffff; font-size: 1.1rem; font-weight: 600;
      text-shadow: 0 0 8px #00ffff; pointer-events: none;
    }
    #hud { display: none; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">
      <h1 class="title">Neon Dash</h1>
      <p class="subtitle">Synthwave Runner</p>
      <button id="start-btn">Play</button>
      <p class="hint">Swipe or arrow keys to dash between lanes<br>Tap / Space to jump</p>
    </div>
    <div id="hud">
      <span id="score-display">0</span>
      <span id="speed-display">1.0x</span>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    // Placeholder for game logic - title screen ready
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('ui-overlay');
    startBtn.addEventListener('click', () => {
      overlay.classList.add('hidden');
      // Game will start here later
      console.log('Neon Dash starting...');
    });
    // Prevent default touch behaviors for mobile
    document.addEventListener('touchmove', e => { if (e.target.closest('#start-btn') === null) e.preventDefault(); }, { passive: false });
  </script>
</body>
</html>
