<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Neon Dash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050010; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; touch-action: none; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: radial-gradient(ellipse at center, rgba(25,0,50,0.75) 0%, rgba(5,0,15,0.97) 100%);
      transition: opacity 0.6s ease; z-index: 10;
    }
    #ui-overlay.hidden { opacity: 0; pointer-events: none; }
    .title {
      font-size: clamp(2.8rem, 13vw, 5.5rem);
      font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
      background: linear-gradient(90deg, #ff00aa, #00f0ff, #ff00aa, #00f0ff);
      background-size: 300% auto;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: neon-flow 4s linear infinite, pulse-glow 2.2s ease-in-out infinite;
      margin-bottom: 0.3rem; text-align: center; filter: drop-shadow(0 0 12px rgba(255,0,170,0.6));
    }
    @keyframes neon-flow { to { background-position: 300% center; } }
    @keyframes pulse-glow { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,0,170,0.5)) brightness(1); } 50% { filter: drop-shadow(0 0 22px rgba(0,240,255,0.7)) brightness(1.25); } }
    .subtitle {
      color: #00f0ff; font-size: clamp(0.85rem, 2.8vw, 1.15rem); letter-spacing: 0.45em; text-transform: uppercase;
      margin-bottom: 2.2rem; opacity: 0.9; text-shadow: 0 0 12px #00f0ff;
    }
    #start-btn, #retry-btn {
      pointer-events: auto; padding: 1.05rem 2.8rem; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: #0a001a; background: linear-gradient(135deg, #ff00aa, #ff55cc);
      border: none; border-radius: 999px; cursor: pointer;
      box-shadow: 0 0 28px rgba(255,0,170,0.65), 0 0 55px rgba(255,0,170,0.25);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #start-btn:active, #retry-btn:active { transform: scale(0.97); }
    .hint { margin-top: 1.8rem; color: #b999ff; font-size: 0.8rem; opacity: 0.75; text-align: center; max-width: 92%; line-height: 1.5; }
    #hud {
      position: absolute; top: 0; left: 0; right: 0; padding: 0.9rem 1.1rem;
      display: none; justify-content: space-between; align-items: flex-start;
      color: #00f0ff; font-size: clamp(1rem, 3.5vw, 1.25rem); font-weight: 700;
      text-shadow: 0 0 10px #00f0ff; pointer-events: none; z-index: 5;
    }
    #hud.visible { display: flex; }
    #multiplier { color: #ff00aa; font-size: 0.85em; opacity: 0; transition: opacity 0.2s; }
    #multiplier.show { opacity: 1; }
    #gameover {
      position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center;
      background: radial-gradient(ellipse at center, rgba(40,0,60,0.85) 0%, rgba(5,0,15,0.97) 100%);
      z-index: 20; pointer-events: none;
    }
    #gameover.visible { display: flex; pointer-events: auto; }
    #gameover h2 { color: #ff00aa; font-size: clamp(2rem, 9vw, 3.2rem); letter-spacing: 0.15em; text-shadow: 0 0 20px #ff00aa; margin-bottom: 0.6rem; }
    #final-score { color: #00f0ff; font-size: 1.4rem; margin-bottom: 1.8rem; text-shadow: 0 0 10px #00f0ff; }
    #event-banner {
      position: absolute; top: 18%; left: 50%; transform: translateX(-50%) scale(0.8);
      color: #fff; font-size: clamp(1.1rem, 4.5vw, 1.6rem); font-weight: 800; letter-spacing: 0.2em;
      text-transform: uppercase; opacity: 0; pointer-events: none; z-index: 15;
      text-shadow: 0 0 15px #ff00aa, 0 0 30px #00f0ff; transition: opacity 0.3s, transform 0.3s;
    }
    #event-banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
    #touch-zones { position: absolute; inset: 0; display: none; z-index: 4; pointer-events: none; }
    #touch-zones.active { display: block; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">
      <h1 class="title">Neon Dash</h1>
      <p class="subtitle">Synthwave Runner</p>
      <button id="start-btn">Play</button>
      <p class="hint">Swipe ◀ ▶ to change lanes · Swipe ▲ to jump<br>Hold for NEON DASH · Collect crystals · Survive the glitches</p>
    </div>
    <div id="hud">
      <div>
        <div id="score-display">0</div>
        <div id="multiplier">x1</div>
      </div>
      <div id="speed-display">1.0×</div>
    </div>
    <div id="event-banner"></div>
    <div id="gameover">
      <h2>SIGNAL LOST</h2>
      <div id="final-score">Score: 0</div>
      <button id="retry-btn">Reboot</button>
    </div>
    <div id="touch-zones"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ========== CONFIG ==========
    const LANES = [-2.4, 0, 2.4];
    const ROAD_WIDTH = 8;
    const SEGMENT_LENGTH = 20;
    const NUM_SEGMENTS = 12;
    const BASE_SPEED = 18;
    const JUMP_FORCE = 11;
    const GRAVITY = 28;

    // ========== STATE ==========
    let scene, camera, renderer, composer, clock;
    let player, playerMesh, trail;
    let roadSegments = [];
    let obstacles = [];
    let crystals = [];
    let particles = [];
    let ambientStars;
    let gameState = 'title'; // title | playing | dead
    let score = 0, distance = 0, multiplier = 1, streak = 0;
    let speedMul = 1, baseSpeed = BASE_SPEED;
    let lane = 1, targetLane = 1, laneLerp = 0;
    let playerY = 0, vy = 0, isGrounded = true;
    let invuln = 0, dashTimer = 0, dashCooldown = 0;
    let nextSpawnZ = -40;
    let eventTimer = 0, currentEvent = null;
    let keys = {};
    let touchStart = null;
    let lastTap = 0;

    // DOM
    const overlay = document.getElementById('ui-overlay');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score-display');
    const speedEl = document.getElementById('speed-display');
    const multEl = document.getElementById('multiplier');
    const gameover = document.getElementById('gameover');
    const finalScore = document.getElementById('final-score');
    const eventBanner = document.getElementById('event-banner');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');

    // ========== PROCEDURAL TEXTURES (synthwave inspired by generated assets) ==========
    function createNeonGridTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#050018';
      ctx.fillRect(0, 0, 256, 256);
      // subtle noise
      for (let i = 0; i < 800; i++) {
        ctx.fillStyle = `rgba(${20 + Math.random()*40},0,${40 + Math.random()*60},${0.05 + Math.random()*0.1})`;
        ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
      }
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 6;
      for (let i = 0; i <= 8; i++) {
        const p = (i / 8) * 256;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(256, p); ctx.stroke();
      }
      // magenta accent lines
      ctx.strokeStyle = '#ff00aa';
      ctx.shadowColor = '#ff00aa';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const p = (i / 4) * 256 + 16;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 256); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 8);
      return tex;
    }

    function createCircuitTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0a0518';
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = '#ff00aa';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#ff00aa';
      ctx.shadowBlur = 4;
      // circuit paths
      const paths = [
        [[10,10],[50,10],[50,60],[90,60],[90,110]],
        [[20,100],[60,100],[60,40],[110,40]],
        [[70,20],[110,20],[110,80],[40,80],[40,120]]
      ];
      paths.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p[0][0], p[0][1]);
        for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
        ctx.stroke();
      });
      // nodes
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      [[50,10],[50,60],[90,60],[60,100],[110,40],[110,20]].forEach(([x,y]) => {
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
      });
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // ========== INIT ==========
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050010);
      scene.fog = new THREE.FogExp2(0x0a0020, 0.018);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 4.5, 8);
      camera.lookAt(0, 1, -10);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Bloom
      const renderPass = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.5, 0.75);
      composer = new EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);

      clock = new THREE.Clock();

      // Lights
      const amb = new THREE.AmbientLight(0x220033, 0.4);
      scene.add(amb);
      const neon1 = new THREE.PointLight(0xff00aa, 2.5, 40);
      neon1.position.set(-6, 5, 0);
      scene.add(neon1);
      const neon2 = new THREE.PointLight(0x00f0ff, 2.5, 40);
      neon2.position.set(6, 5, 0);
      scene.add(neon2);

      // Stars
      const starGeo = new THREE.BufferGeometry();
      const starPos = [];
      for (let i = 0; i < 600; i++) {
        starPos.push((Math.random()-0.5)*120, Math.random()*40 + 5, (Math.random()-0.5)*180 - 40);
      }
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
      ambientStars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaa88ff, size: 0.12, transparent: true, opacity: 0.8 }));
      scene.add(ambientStars);

      // Player
      createPlayer();
      // Road
      const gridTex = createNeonGridTexture();
      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const seg = createRoadSegment(gridTex);
        seg.position.z = -i * SEGMENT_LENGTH;
        scene.add(seg);
        roadSegments.push(seg);
      }
      // Side rails / neon walls
      createSideRails();

      window.addEventListener('resize', onResize);
      setupInput();
      animate();
    }

    function createPlayer() {
      player = new THREE.Group();
      // Body - hover craft
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x1a0033, emissive: 0xff00aa, emissiveIntensity: 0.45,
        metalness: 0.8, roughness: 0.3
      });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.35, 1.8), bodyMat);
      body.position.y = 0.4;
      player.add(body);
      // Cockpit
      const cockMat = new THREE.MeshStandardMaterial({
        color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 0.9, transparent: true, opacity: 0.85
      });
      const cock = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), cockMat);
      cock.position.set(0, 0.65, -0.15);
      cock.scale.set(1, 0.7, 1.2);
      player.add(cock);
      // Wings
      const wingMat = new THREE.MeshStandardMaterial({ color: 0x220044, emissive: 0x00aaff, emissiveIntensity: 0.35 });
      const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 1.2), wingMat);
      wingL.position.set(-0.7, 0.35, 0.1);
      player.add(wingL);
      const wingR = wingL.clone();
      wingR.position.x = 0.7;
      player.add(wingR);
      // Engine glow
      const engMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
      const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.25, 0.15, 10), engMat);
      eng.rotation.x = Math.PI / 2;
      eng.position.set(0, 0.3, 0.95);
      player.add(eng);
      // Trail points
      const trailGeo = new THREE.BufferGeometry();
      const trailPos = new Float32Array(60 * 3);
      trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
      trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({
        color: 0xff00aa, size: 0.18, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending
      }));
      scene.add(trail);

      player.position.set(0, 0, 0);
      scene.add(player);
      playerMesh = player;
    }

    function createRoadSegment(tex) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        map: tex, color: 0xffffff, emissive: 0x001122, emissiveIntensity: 0.3,
        metalness: 0.2, roughness: 0.7
      });
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH), mat);
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = 0;
      g.add(plane);
      // Lane markers (emissive lines)
      const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
      [-1.2, 1.2].forEach(x => {
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, SEGMENT_LENGTH), lineMat);
        line.position.set(x, 0.02, 0);
        g.add(line);
      });
      // Edge neon
      const edgeMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
      [-ROAD_WIDTH/2 + 0.1, ROAD_WIDTH/2 - 0.1].forEach(x => {
        const edge = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, SEGMENT_LENGTH), edgeMat);
        edge.position.set(x, 0.04, 0);
        g.add(edge);
      });
      return g;
    }

    function createSideRails() {
      const railMat = new THREE.MeshStandardMaterial({
        color: 0x110022, emissive: 0xff00aa, emissiveIntensity: 0.6, metalness: 0.9
      });
      for (let side of [-1, 1]) {
        for (let i = 0; i < 8; i++) {
          const post = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.8, 0.25), railMat);
          post.position.set(side * (ROAD_WIDTH/2 + 0.6), 0.9, -i * 12);
          scene.add(post);
        }
      }
    }

    // ========== SPAWN ==========
    function spawnObstacle(z) {
      const type = Math.random();
      const laneIdx = Math.floor(Math.random() * 3);
      const group = new THREE.Group();
      group.userData = { type: 'obstacle', lane: laneIdx, z };

      if (type < 0.35) {
        // Barrier wall (jump)
        const mat = new THREE.MeshStandardMaterial({
          color: 0x220033, emissive: 0xff0066, emissiveIntensity: 0.7, metalness: 0.6
        });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.1, 0.5), mat);
        wall.position.y = 0.55;
        group.add(wall);
        // top glow
        const glow = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.08, 0.55), new THREE.MeshBasicMaterial({ color: 0xff00aa }));
        glow.position.y = 1.15;
        group.add(glow);
        group.userData.kind = 'jump';
      } else if (type < 0.6) {
        // Low barrier (duck / but we jump over high, this is low)
        const mat = new THREE.MeshStandardMaterial({
          color: 0x001133, emissive: 0x00aaff, emissiveIntensity: 0.6
        });
        const bar = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 0.6), mat);
        bar.position.y = 0.25;
        group.add(bar);
        group.userData.kind = 'low';
      } else if (type < 0.8) {
        // Pillar gate (two sides, center free? no, solid middle for variety)
        const mat = new THREE.MeshStandardMaterial({
          color: 0x1a0030, emissive: 0xaa00ff, emissiveIntensity: 0.5
        });
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 2.2, 8), mat);
        pillar.position.y = 1.1;
        group.add(pillar);
        group.userData.kind = 'pillar';
      } else {
        // Spinning hazard
        const mat = new THREE.MeshStandardMaterial({
          color: 0x330011, emissive: 0xff2200, emissiveIntensity: 0.8
        });
        const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.55), mat);
        core.position.y = 0.9;
        group.add(core);
        group.userData.kind = 'spin';
        group.userData.spin = true;
      }
      group.position.set(LANES[laneIdx], 0, z);
      scene.add(group);
      obstacles.push(group);
    }

    function spawnCrystal(z) {
      const laneIdx = Math.floor(Math.random() * 3);
      const geo = new THREE.OctahedronGeometry(0.35, 0);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1.2,
        metalness: 0.3, roughness: 0.2, transparent: true, opacity: 0.9
      });
      const crystal = new THREE.Mesh(geo, mat);
      crystal.position.set(LANES[laneIdx], 1.1 + Math.random() * 0.4, z);
      crystal.userData = { type: 'crystal', lane: laneIdx, baseY: crystal.position.y };
      scene.add(crystal);
      crystals.push(crystal);
    }

    function spawnAhead() {
      while (nextSpawnZ > player.position.z - 80) {
        // density increases with speed
        const dens = 0.35 + Math.min(0.4, (speedMul - 1) * 0.2);
        if (Math.random() < dens) spawnObstacle(nextSpawnZ);
        if (Math.random() < 0.45) spawnCrystal(nextSpawnZ - 4 + Math.random() * 6);
        nextSpawnZ -= 9 + Math.random() * 7;
      }
    }

    // ========== INPUT ==========
    function setupInput() {
      window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (gameState === 'playing') {
          if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
          if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
          if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
          if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') tryDash();
        }
      });
      window.addEventListener('keyup', e => { keys[e.code] = false; });

      const canvas = renderer.domElement;
      canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: performance.now() };
        }
      }, { passive: true });
      canvas.addEventListener('touchend', e => {
        if (!touchStart || gameState !== 'playing') return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        const dt = performance.now() - touchStart.t;
        const absX = Math.abs(dx), absY = Math.abs(dy);
        if (dt < 350 && (absX > 30 || absY > 30)) {
          if (absX > absY) {
            changeLane(dx > 0 ? 1 : -1);
          } else if (dy < -25) {
            jump();
          }
        } else if (dt < 200 && absX < 20 && absY < 20) {
          // tap = jump or double-tap dash
          const now = performance.now();
          if (now - lastTap < 280) tryDash();
          else jump();
          lastTap = now;
        }
        touchStart = null;
      }, { passive: true });

      // Hold anywhere for dash (mobile)
      let holdTimer = null;
      canvas.addEventListener('touchstart', () => {
        if (gameState !== 'playing') return;
        holdTimer = setTimeout(() => tryDash(), 400);
      });
      canvas.addEventListener('touchend', () => clearTimeout(holdTimer));
      canvas.addEventListener('touchcancel', () => clearTimeout(holdTimer));
    }

    function changeLane(dir) {
      const next = THREE.MathUtils.clamp(targetLane + dir, 0, 2);
      if (next !== targetLane) {
        targetLane = next;
        // small feedback particles
        spawnBurst(player.position.clone().add(new THREE.Vector3(0,0.5,0)), 0x00f0ff, 8);
      }
    }

    function jump() {
      if (isGrounded && gameState === 'playing') {
        vy = JUMP_FORCE;
        isGrounded = false;
        spawnBurst(player.position.clone(), 0xff00aa, 12);
      }
    }

    function tryDash() {
      if (dashCooldown <= 0 && gameState === 'playing') {
        dashTimer = 0.55;
        invuln = Math.max(invuln, 0.55);
        dashCooldown = 2.8;
        speedMul = Math.min(speedMul + 0.15, 3.5);
        spawnBurst(player.position.clone(), 0xffffff, 20);
        showEvent('NEON DASH');
      }
    }

    // ========== EVENTS / SURPRISES ==========
    function triggerRandomEvent() {
      const events = [
        { name: 'GLITCH WAVE', fn: () => { invuln = 2.5; speedMul += 0.25; } },
        { name: 'CRYSTAL RAIN', fn: () => {
          for (let i = 0; i < 12; i++) spawnCrystal(player.position.z - 25 - i * 4);
        }},
        { name: 'PHASE SHIFT', fn: () => {
          // temporary FOV and lane swap feel
          camera.fov = 85;
          camera.updateProjectionMatrix();
          setTimeout(() => { camera.fov = 65; camera.updateProjectionMatrix(); }, 2200);
        }},
        { name: 'OVERCLOCK', fn: () => { baseSpeed *= 1.12; } }
      ];
      const e = events[Math.floor(Math.random() * events.length)];
      currentEvent = e.name;
      e.fn();
      showEvent(e.name);
    }

    function showEvent(text) {
      eventBanner.textContent = text;
      eventBanner.classList.add('show');
      setTimeout(() => eventBanner.classList.remove('show'), 1600);
    }

    function spawnBurst(pos, color, count) {
      for (let i = 0; i < count; i++) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.08 + Math.random()*0.06, 4, 4),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
        );
        m.position.copy(pos);
        m.userData = {
          vel: new THREE.Vector3((Math.random()-0.5)*6, Math.random()*5 + 1, (Math.random()-0.5)*4 - 2),
          life: 0.6 + Math.random()*0.4
        };
        scene.add(m);
        particles.push(m);
      }
    }

    // ========== GAME FLOW ==========
    function startGame() {
      overlay.classList.add('hidden');
      gameover.classList.remove('visible');
      hud.classList.add('visible');
      gameState = 'playing';
      score = 0; distance = 0; multiplier = 1; streak = 0;
      speedMul = 1; baseSpeed = BASE_SPEED;
      lane = 1; targetLane = 1;
      player.position.set(0, 0, 0);
      playerY = 0; vy = 0; isGrounded = true;
      invuln = 1.5; dashTimer = 0; dashCooldown = 0;
      nextSpawnZ = -30;
      eventTimer = 18 + Math.random()*10;
      // clear old
      obstacles.forEach(o => scene.remove(o));
      crystals.forEach(c => scene.remove(c));
      particles.forEach(p => scene.remove(p));
      obstacles = []; crystals = []; particles = [];
      // reset road
      roadSegments.forEach((s, i) => { s.position.z = -i * SEGMENT_LENGTH; });
      spawnAhead();
    }

    function die() {
      if (invuln > 0) return;
      gameState = 'dead';
      spawnBurst(player.position.clone().add(new THREE.Vector3(0,0.6,0)), 0xff0044, 35);
      finalScore.textContent = `Score: ${Math.floor(score)}`;
      gameover.classList.add('visible');
      hud.classList.remove('visible');
    }

    // ========== UPDATE ==========
    function update(dt) {
      if (gameState !== 'playing') {
        // idle title camera sway
        if (gameState === 'title') {
          camera.position.x = Math.sin(clock.elapsedTime * 0.3) * 1.5;
          camera.position.y = 4.5 + Math.sin(clock.elapsedTime * 0.4) * 0.3;
          camera.lookAt(0, 1, -8);
        }
        return;
      }

      const speed = baseSpeed * speedMul;
      distance += speed * dt;
      score += speed * dt * multiplier * (dashTimer > 0 ? 2.2 : 1);

      // Lane lerp
      const targetX = LANES[targetLane];
      player.position.x = THREE.MathUtils.lerp(player.position.x, targetX, 1 - Math.pow(0.001, dt));
      lane = targetLane;

      // Jump physics
      if (!isGrounded || vy > 0) {
        vy -= GRAVITY * dt;
        playerY += vy * dt;
        if (playerY <= 0) {
          playerY = 0; vy = 0; isGrounded = true;
        }
      }
      player.position.y = playerY;
      // slight lean
      player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -player.position.x * 0.08, 0.1);
      player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, dashTimer > 0 ? -0.15 : 0, 0.1);

      // Move world toward player (infinite)
      const move = speed * dt;
      roadSegments.forEach(seg => {
        seg.position.z += move;
        if (seg.position.z > SEGMENT_LENGTH) {
          seg.position.z -= NUM_SEGMENTS * SEGMENT_LENGTH;
        }
      });
      obstacles.forEach(o => { o.position.z += move; });
      crystals.forEach(c => { c.position.z += move; });

      // Camera follow
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x * 0.55, 0.08);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 4.2 + playerY * 0.3, 0.08);
      camera.position.z = 7.5;
      camera.lookAt(player.position.x * 0.4, 1.2 + playerY * 0.5, player.position.z - 12);

      // Timers
      if (invuln > 0) invuln -= dt;
      if (dashTimer > 0) dashTimer -= dt;
      if (dashCooldown > 0) dashCooldown -= dt;
      eventTimer -= dt;
      if (eventTimer <= 0) {
        triggerRandomEvent();
        eventTimer = 16 + Math.random() * 14;
      }

      // Spin hazards
      obstacles.forEach(o => {
        if (o.userData.spin) o.children[0].rotation.y += dt * 4;
        if (o.userData.kind === 'spin') o.children[0].rotation.x += dt * 2.5;
      });

      // Crystals bob + collect
      for (let i = crystals.length - 1; i >= 0; i--) {
        const c = crystals[i];
        c.rotation.y += dt * 3;
        c.position.y = c.userData.baseY + Math.sin(clock.elapsedTime * 4 + i) * 0.15;
        if (c.position.z > 8) {
          scene.remove(c); crystals.splice(i, 1); continue;
        }
        const dx = c.position.x - player.position.x;
        const dy = c.position.y - (player.position.y + 0.5);
        const dz = c.position.z - player.position.z;
        if (Math.abs(dx) < 1.1 && Math.abs(dy) < 1.2 && Math.abs(dz) < 1.4) {
          scene.remove(c); crystals.splice(i, 1);
          streak++;
          multiplier = 1 + Math.min(4, Math.floor(streak / 4) * 0.5);
          score += 50 * multiplier;
          spawnBurst(c.position, 0x00ffff, 10);
          multEl.textContent = `×${multiplier.toFixed(1)}`;
          multEl.classList.add('show');
        }
      }

      // Obstacle collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        if (o.position.z > 10) {
          scene.remove(o); obstacles.splice(i, 1); continue;
        }
        const dx = Math.abs(o.position.x - player.position.x);
        const dz = Math.abs(o.position.z - player.position.z);
        if (dx < 1.15 && dz < 1.3) {
          const kind = o.userData.kind;
          let hit = false;
          if (kind === 'jump' && playerY < 1.05) hit = true;
          else if (kind === 'low' && playerY < 0.55) hit = true;
          else if (kind === 'pillar' || kind === 'spin') {
            if (playerY < 1.6) hit = true;
          }
          if (hit) {
            die();
            break;
          }
        }
      }

      // Trail update
      const posAttr = trail.geometry.attributes.position;
      for (let i = posAttr.count - 1; i > 0; i--) {
        posAttr.setXYZ(i, posAttr.getX(i-1), posAttr.getY(i-1), posAttr.getZ(i-1));
      }
      posAttr.setXYZ(0, player.position.x, player.position.y + 0.3, player.position.z + 0.9);
      posAttr.needsUpdate = true;
      trail.material.opacity = dashTimer > 0 ? 0.95 : 0.55;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.userData.life -= dt;
        p.position.addScaledVector(p.userData.vel, dt);
        p.userData.vel.y -= 8 * dt;
        p.material.opacity = Math.max(0, p.userData.life * 1.5);
        if (p.userData.life <= 0) {
          scene.remove(p); particles.splice(i, 1);
        }
      }

      // Ambient stars drift
      ambientStars.rotation.y += dt * 0.02;

      // Spawn more
      spawnAhead();

      // UI
      scoreEl.textContent = Math.floor(score).toLocaleString();
      speedEl.textContent = speedMul.toFixed(1) + '×';
      if (streak === 0) multEl.classList.remove('show');
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      composer.render();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    // Buttons
    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);

    // Prevent scroll/zoom
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault());

    init();
  </script>
</body>
</html>
